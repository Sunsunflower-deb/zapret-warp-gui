name: build-exe

on:
  workflow_dispatch:            # ручной запуск: Actions → build-exe → Run
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write           # чтобы публиковать Release (тег v*)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установка зависимостей
        run: python -m pip install pyinstaller pytest ruff

      # Дешёвая защита: не публиковать релиз с красными тестами.
      - name: Линтер и тесты
        run: |
          python -m ruff check .
          python -m pytest -q

      # spec собирает два файла: zapret-warp.exe (GUI) и zapret-warp-cli.exe (CLI).
      - name: Сборка .exe
        run: python -m PyInstaller zapret-warp.spec --noconfirm --clean

      - name: Проверка артефактов
        shell: pwsh
        run: |
          foreach ($f in @("dist/zapret-warp.exe", "dist/zapret-warp-cli.exe")) {
            if (-not (Test-Path $f)) { throw "не собран $f" }
          }
          # CLI-бинарь обязан отвечать на --version, иначе он собрался не из cli.py
          $v = & "./dist/zapret-warp-cli.exe" --version
          if ($LASTEXITCODE -ne 0 -or $v -notmatch "zapret-warp") { throw "CLI не отвечает: $v" }

      # Официальный установщик Cloudflare WARP — кладём рядом с exe,
      # приложение само поставит его, если warp-cli не найден.
      - name: Скачивание warp.msi (авто-установщик WARP)
        run: curl -L -o warp.msi https://1111-releases.cloudflareclient.com/windows/Cloudflare_WARP_Release-x64.msi

      - name: Контрольные суммы
        shell: pwsh
        run: |
          Get-FileHash dist/zapret-warp.exe, dist/zapret-warp-cli.exe, warp.msi -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Set-Content -Path SHA256SUMS.txt -Encoding ascii
          Get-Content SHA256SUMS.txt

      - name: Загрузка артефакта
        uses: actions/upload-artifact@v4
        with:
          name: zapret-warp-windows
          path: |
            dist/zapret-warp.exe
            dist/zapret-warp-cli.exe
            warp.msi
            SHA256SUMS.txt

      # Автопубликация в GitHub Releases при пуше тега v*.
      # generate_release_notes: false — описание релиза пишем руками из CHANGELOG,
      # автоматические заметки только дублируют список коммитов.
      - name: Публикация Release (тег v*)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/zapret-warp.exe
            dist/zapret-warp-cli.exe
            warp.msi
            SHA256SUMS.txt
          generate_release_notes: false
          draft: false

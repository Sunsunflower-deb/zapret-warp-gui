name: build-exe

on:
  workflow_dispatch:            # ручной запуск: Actions → build-exe → Run
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установка PyInstaller
        run: python -m pip install pyinstaller

      - name: Сборка .exe
        run: python -m PyInstaller zapret-warp.spec --noconfirm --clean

      - name: Загрузка артефакта
        uses: actions/upload-artifact@v4
        with:
          name: zapret-warp-windows
          path: dist/zapret-warp.exe
